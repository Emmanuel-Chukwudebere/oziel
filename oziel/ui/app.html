<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Oziel</title>
<style>
  :root {
    --bg: #0b0d12; --ink: #e8e6e1; --dim: #8a8f9c;
    --accent: #d4a24e; --accent-soft: rgba(212,162,78,0.18);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: ui-serif, "Iowan Old Style", Georgia, serif;
    height: 100vh; overflow: hidden; user-select: none;
  }
  header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 1rem 1.25rem;
  }
  header .brand { letter-spacing: 0.04em; }
  header .brand em { font-style: normal; color: var(--accent); }
  header button {
    background: none; border: none; color: var(--dim);
    font-size: 1.1rem; cursor: pointer;
  }
  header button:hover { color: var(--accent); }

  /* ------ the orb ------ */
  .stage { display: flex; flex-direction: column; align-items: center; padding-top: 1.25rem; }
  .orb {
    width: 130px; height: 130px; border-radius: 50%;
    background: radial-gradient(circle at 36% 32%,
      #f4e3c2 0%, var(--accent) 34%, #7a5a22 72%, #211a0d 100%);
    box-shadow: 0 0 42px var(--accent-soft);
    animation: breathe 4.5s ease-in-out infinite;
    position: relative;
  }
  @keyframes breathe {
    0%, 100% { transform: scale(1);    box-shadow: 0 0 32px var(--accent-soft); }
    50%      { transform: scale(1.05); box-shadow: 0 0 58px var(--accent-soft); }
  }
  .orb.speaking { animation: glow 0.9s ease-in-out infinite; }
  @keyframes glow {
    0%, 100% { box-shadow: 0 0 40px rgba(212,162,78,0.35); transform: scale(1.02); }
    50%      { box-shadow: 0 0 85px rgba(212,162,78,0.65); transform: scale(1.08); }
  }
  .orb.listening::after {
    content: ""; position: absolute; inset: -14px; border-radius: 50%;
    border: 1.5px solid var(--accent); opacity: 0;
    animation: ripple 1.6s ease-out infinite;
  }
  @keyframes ripple {
    0% { transform: scale(0.85); opacity: 0.7; } 100% { transform: scale(1.25); opacity: 0; }
  }
  .orb.dim { filter: grayscale(0.8) brightness(0.55); animation: none; }

  .status {
    margin-top: 1.1rem; font-family: ui-monospace, Consolas, monospace;
    font-size: 0.72rem; letter-spacing: 0.28em; color: var(--dim);
    text-transform: uppercase;
  }

  /* ------ captions / content ------ */
  .content { padding: 1.4rem 1.6rem; text-align: center; }
  .caption { color: var(--ink); font-size: 1.02rem; line-height: 1.55; min-height: 3.2em; }
  .caption .err { color: #d46a4e; font-size: 0.9rem; }

  .cards { display: flex; flex-direction: column; gap: 0.6rem; margin-top: 1.1rem; }
  .card {
    background: #12151d; border: 1px solid #232837; border-radius: 10px;
    color: var(--ink); padding: 0.8rem 1rem; font-size: 0.98rem;
    cursor: pointer; font-family: inherit;
    display: flex; justify-content: space-between; align-items: center;
  }
  .card:hover { border-color: var(--accent); }
  .card.primary { border-color: var(--accent); background: var(--accent-soft); }
  .card small { color: var(--dim); font-family: ui-monospace, Consolas, monospace; font-size: 0.7rem; }
  .card:disabled { opacity: 0.45; cursor: wait; }

  input[type="password"], input[type="text"] {
    width: 100%; background: #12151d; border: 1px solid #232837; border-radius: 10px;
    color: var(--ink); padding: 0.8rem 1rem; font-family: ui-monospace, Consolas, monospace;
    font-size: 0.9rem; outline: none; text-align: center;
  }
  input:focus { border-color: var(--accent); }

  .chips {
    display: flex; gap: 0.45rem; justify-content: center; margin-top: 0.4rem;
  }
  .chip {
    width: 26px; height: 3px; border-radius: 2px; background: #232837;
  }
  .chip.on { background: var(--accent); }

  .meter { margin-top: 1.4rem; font-family: ui-monospace, Consolas, monospace; font-size: 0.72rem; color: var(--dim); }
  .meter .bar { height: 3px; background: #232837; border-radius: 2px; margin-top: 0.4rem; }
  .meter .fill { height: 100%; background: var(--accent); border-radius: 2px; width: 0%; }

  /* settings slide-over */
  #settings {
    position: fixed; inset: 0; background: rgba(11,13,18,0.96);
    padding: 2rem 1.6rem; transform: translateX(100%); transition: transform 0.25s ease;
    overflow-y: auto;
  }
  #settings.open { transform: translateX(0); }
  #settings h2 { font-weight: 400; margin-bottom: 1.2rem; }
  #settings .row { margin-bottom: 1rem; text-align: left; }
  #settings .row label { display: block; color: var(--dim); font-size: 0.8rem; margin-bottom: 0.4rem; }
</style>
</head>
<body>
<header>
  <span class="brand">Ozi<em>el</em></span>
  <button id="gear" title="Settings">⚙</button>
</header>

<div class="stage">
  <div class="orb" id="orb"></div>
  <div class="status" id="status">WAKING UP</div>
  <div class="chips" id="chips" hidden>
    <div class="chip" data-s="key"></div><div class="chip" data-s="hear"></div>
    <div class="chip" data-s="name"></div><div class="chip" data-s="voice"></div>
    <div class="chip" data-s="done"></div>
  </div>
</div>

<div class="content">
  <div class="caption" id="caption"></div>
  <div class="cards" id="cards"></div>
  <div class="meter" id="meter" hidden>
    <span id="meterText">credits $0.00 / $10.00</span>
    <div class="bar"><div class="fill" id="meterFill"></div></div>
  </div>
</div>

<div id="settings">
  <h2>Settings</h2>
  <div class="row"><label>Voice</label><div class="cards" id="setVoice"></div></div>
  <div class="row"><label>Replies</label><div class="cards" id="setVerbosity"></div></div>
  <div class="row"><label>Go-phrase</label>
    <button class="card" disabled>Recorded by voice — arrives with my ears (next build)</button>
  </div>
  <div class="row"><label>Start over</label>
    <button class="card" id="resetSetup">Reset setup — relive the first run</button>
  </div>
  <button class="card" id="closeSettings">← Back</button>
</div>

<script>
const $ = id => document.getElementById(id);
const api = () => window.pywebview.api;
const VOICES = [
  ["en_paul_neutral", "Neutral", "steady and calm"],
  ["en_paul_confident", "Confident", "gets things done"],
  ["en_paul_happy", "Happy", "sunny, upbeat"],
];

function orb(state) {           // idle | speaking | listening | dim
  $("orb").className = "orb" + (state === "idle" ? "" : " " + state);
}
function status(t) { $("status").textContent = t; }
function caption(t, isErr) {
  $("caption").innerHTML = isErr ? `<span class="err">${t}</span>` : t;
}
function cards(list) {          // [[label, onclick, primary, sub], ...]
  const box = $("cards"); box.innerHTML = "";
  for (const [label, fn, primary, sub] of list) {
    const b = document.createElement("button");
    b.className = "card" + (primary ? " primary" : "");
    b.innerHTML = label + (sub ? `<small>${sub}</small>` : "");
    b.onclick = () => fn(b);
    box.appendChild(b);
  }
}
function chip(step) {
  $("chips").hidden = false;
  const order = ["key", "hear", "name", "voice", "done"];
  document.querySelectorAll(".chip").forEach(c =>
    c.classList.toggle("on", order.indexOf(c.dataset.s) <= order.indexOf(step)));
}
async function speakUI(text, voice) {
  orb("speaking"); status("SPEAKING");
  const r = await api().speak(text, voice || null);
  orb("idle"); status("IDLE");
  if (!r.ok) caption("Voice error: " + r.error, true);
  return r.ok;
}

/* ---------- setup flow ---------- */
async function stepKey() {
  chip("key"); orb("dim"); status("SETUP — YOUR KEY");
  caption("Paste your Mistral API key.<br>It's the only thing you'll ever type.");
  const box = $("cards"); box.innerHTML = "";
  const input = document.createElement("input");
  input.type = "password"; input.placeholder = "paste your key here";
  const go = document.createElement("button");
  go.className = "card primary"; go.textContent = "Connect";
  const submit = async (fn) => {
    go.disabled = true; status("CHECKING KEY");
    let r;
    try { r = await fn(); }
    catch (e) { r = { ok: false, error: "App error: " + e }; }
    if (r.ok) stepHear();
    else { go.disabled = false; caption(r.error, true); status("SETUP — YOUR KEY"); }
  };
  go.onclick = () => submit(() => api().save_key(input.value));
  box.append(input, go);
  if (await api().local_key_available()) {
    const local = document.createElement("button");
    local.className = "card";
    local.innerHTML = "Use the key found on this machine <small>.env</small>";
    local.onclick = () => submit(() => api().use_local_key());
    box.appendChild(local);
  }
}
async function stepHear() {
  chip("hear"); orb("idle");
  caption("From here on, we talk.");
  cards([]);
  await new Promise(r => setTimeout(r, 400));
  orb("speaking"); status("SPEAKING");
  caption("“Hello. I'm Oziel. If you can hear me clearly, tap yes.”");
  const r = await api().greet();
  orb("idle"); status("WAITING");
  if (!r.ok) { caption("I couldn't speak: " + r.error, true); }
  cards([
    ["Yes — I hear you", () => stepName(), true],
    ["Play it again", () => stepHear()],
  ]);
}
function stepName() {
  chip("name"); orb("idle"); status("SETUP — YOUR NAME");
  caption("What should I call you?<br><small style='color:var(--dim)'>Once I have ears, you'll just say it.</small>");
  const box = $("cards"); box.innerHTML = "";
  const input = document.createElement("input");
  input.type = "text"; input.placeholder = "your name";
  const go = document.createElement("button");
  go.className = "card primary"; go.textContent = "That's me";
  go.onclick = async () => {
    go.disabled = true;
    const r = await api().save_name(input.value);
    if (!r.ok) { go.disabled = false; caption(r.error, true); return; }
    caption("");
    await speakUI(`Nice to meet you, ${input.value.trim()}. Now — help me pick my voice.`);
    stepVoice();
  };
  box.append(input, go);
}
function stepVoice() {
  chip("voice"); status("SETUP — PICK MY VOICE");
  caption("Which voice should be mine?<br>Tap ▶ to hear each.");
  cards(VOICES.map(([slug, name, sub]) => [
    `▶ ${name}`,
    async (btn) => {
      btn.disabled = true;
      await speakUI(null_or_sample(slug), slug);
      btn.disabled = false;
      cards([[`Use ${name}`, async () => {
        await api().choose_voice(slug); stepDone();
      }, true], ["← Hear the others", () => stepVoice()]]);
    },
    false, sub,
  ]));
}
function null_or_sample(slug) {
  return {
    en_paul_neutral: "This is my neutral voice. Steady and calm.",
    en_paul_confident: "This is my confident voice. I get things done.",
    en_paul_happy: "This is my happy voice. Every errand is a pleasure!",
  }[slug];
}
async function stepDone() {
  chip("done"); status("FINISHING");
  caption("That's everything for today.<br>My ears — and your go-phrase — arrive in the next build.");
  cards([]);
  orb("speaking");
  await api().complete_setup();
  home();
}

/* ---------- home ---------- */
async function home() {
  $("chips").hidden = true;
  const s = await api().get_state();
  orb("idle"); status("RESTING — EARS ARRIVE NEXT BUILD");
  caption("I'm set up. The voice loop is the next milestone.");
  cards([["Say hello", async () => {
    await speakUI(`Hello${s.user_name ? " " + s.user_name : ""}. Still here. Still ready.`);
    status("RESTING — EARS ARRIVE NEXT BUILD");
  }, true]]);
  $("meter").hidden = false;
  $("meterText").textContent = `credits $${s.usage_usd.toFixed(2)} / $10.00`;
  $("meterFill").style.width = Math.min(100, s.usage_usd * 10) + "%";
}

/* ---------- settings ---------- */
$("gear").onclick = async () => {
  const s = await api().get_state();
  const v = $("setVoice"); v.innerHTML = "";
  for (const [slug, name] of VOICES) {
    const b = document.createElement("button");
    b.className = "card" + (s.voice === slug ? " primary" : "");
    b.textContent = name;
    b.onclick = async () => { await api().choose_voice(slug); $("gear").onclick(); };
    v.appendChild(b);
  }
  const vb = $("setVerbosity"); vb.innerHTML = "";
  for (const level of ["brief", "chatty"]) {
    const b = document.createElement("button");
    b.className = "card" + (s.verbosity === level ? " primary" : "");
    b.textContent = level;
    b.onclick = async () => { await api().set_verbosity(level); $("gear").onclick(); };
    vb.appendChild(b);
  }
  $("settings").classList.add("open");
};
$("closeSettings").onclick = () => $("settings").classList.remove("open");
$("resetSetup").onclick = async () => {
  await api().reset_setup();
  location.reload();
};

/* ---------- boot ---------- */
window.addEventListener("pywebviewready", async () => {
  const s = await api().get_state();
  if (s.setup_complete) home();
  else if (s.has_key) stepHear();
  else stepKey();
});
</script>
</body>
</html>
